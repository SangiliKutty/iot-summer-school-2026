name: Arduino Lint

on:
  push:
    branches:
      - main

jobs:
  count-ino-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count .ino files
        run: |
          echo "Counting .ino files..."
          find . -name "*.ino" | wc -l
